const KEY='polynomial_game_questions_v4';let questions;

  questions=JSON.parse(localStorage.getItem(KEY));
  if(!Array.isArray(questions)||!questions.length)throw Error();
}catch{
  let prior=null;

    ? prior.filter(item=>Number.isInteger(item.level)&&item.level>=0&&item.level<10).concat(fresh.filter(item=>item.level>=10))
    : fresh;

function normalizeNumber(value){const t=String(value).trim().normalize('NFKC').replace(/[−–—﹣]/g,'-').replace(/[＋﹢]/g,'+').replace(/\s+/g,'');if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(t))return NaN;return Number(t)}
function pretty(x){let s=String(x);
  s=s.replace(/\^\(([^)]+)\)/g,(_,n)=>'<sup>'+n+'</sup>');
  s=s.replace(/\^([A-Za-z\d]+)/g,(_,n)=>'<sup>'+n+'</sup>');

  return s
}
function renderQ(){passed=false;chosen='';showHint=false;$('counter').disabled=true;$('counter').classList.remove('ready');$('counter').title='本關作答進度';$('levelTag').textContent='第 '+(level+1)+' 關';$('levelName').textContent=LEVELS[level][0];$('counter').textContent=order.length?`${Math.min(idx+1,order.length)} / ${order.length} 題`:'尚無題目';$('progress').style.width=(order.length?idx/order.length*100:0)+'%';$('feedback').innerHTML='';$('nextBtn').classList.add('hide');$('checkBtn').classList.remove('hide');$('hintBtn').classList.remove('hide');const a=$('questionArea');a.innerHTML='';if(idx>=order.length){a.innerHTML='<h2>🎉 恭喜完成本關！</h2><p>你完成了這一關的所有練習。想要再挑戰一次，或自由選擇其他關卡，都可以！</p>';if(!order.length)a.innerHTML='<p>此關目前沒有題目，請老師到「編修題庫」新增。</p>';$('checkBtn').classList.add('hide');$('hintBtn').classList.add('hide');$('counter').textContent='✓ 完成｜回關卡首頁';$('counter').disabled=false;$('counter').classList.add('ready');$('counter').title='點選返回自由選關首頁';$('progress').style.width='100%';let b=document.createElement('button');b.className='btn';b.textContent='再練習一次';b.onclick=()=>start(level);a.append(b);
let home=document.createElement('button');home.type='button';home.className='btn ghost';home.textContent='🏠 選擇其他關卡';home.style.marginLeft='10px';home.onclick=()=>{renderHome();view('home')};a.append(home);
return}const q=order[idx];const p=document.createElement('div');p.className='question formula';p.innerHTML=pretty(q.prompt);a.append(p);if(q.type==='choice'){$('checkBtn').classList.add('hide');const opts=document.createElement('div');opts.className='choices';q.options.forEach(opt=>{const b=document.createElement('button');b.className='choice formula';b.innerHTML=pretty(opt);b.onclick=()=>{chosen=opt;opts.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');check()};opts.append(b)});a.append(opts)}else if(q.type==='number'){let d=document.createElement('div');d.className='answerrow';d.innerHTML='<label for="answerInput">答案：</label><input class="num" id="answerInput" inputmode="decimal" autocomplete="off" aria-label="數字答案"><span class="muted">可輸入負數</span>';a.append(d);d.querySelector('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();check()}})}else if(q.type==='synthetic')renderSynth(q,a)}
function synthData(q){let out=[q.coeffs[0]],mul=[null];for(let i=1;i<q.coeffs.length;i++){mul[i]=out[i-1]*q.c;out[i]=q.coeffs[i]+mul[i]}return {out,mul}}
function renderSynth(q,a){
const intro=document.createElement('p');intro.className='hint';intro.textContent='被除式係數（依降冪排列）：'+q.coeffs.join('、')+'；除式：x'+(q.c<0?'＋'+Math.abs(q.c):'－'+q.c)+'。';a.append(intro);
const t=document.createElement('table');t.className='synth';
let html='<tbody><tr><td class="sign-cell"></td>'+q.coeffs.map(v=>'<td>'+v+'</td>').join('')+'<td class="edge" rowspan="3">'+q.c+'</td></tr>';
html+='<tr><td class="sign-cell" aria-label="本列與第一列相加">＋）</td>'+q.coeffs.map((v,i)=>'<td>'+(i===0?'':'<input data-kind="mul" data-i="'+i+'" aria-label="第'+(i+1)+'欄乘積" inputmode="numeric">')+'</td>').join('')+'</tr>';
html+='<tr class="last"><td class="sign-cell"></td>'+q.coeffs.map((v,i)=>'<td><input data-kind="out" data-i="'+i+'" aria-label="第'+(i+1)+'欄結果" inputmode="numeric"></td>').join('')+'</tr></tbody>';
t.innerHTML=html;let div=document.createElement('div');div.className='synth-wrap';div.append(t);a.append(div);
let note=document.createElement('p');note.className='hint';note.textContent='格式依照課本：除式對應的數放在最右側；第二列最左側的「＋）」提醒兩列相加。首項係數直接落下，最右下角是餘式。';a.append(note);t.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();check()}});t.addEventListener('change',()=>{const fields=[...t.querySelectorAll('input')];if(fields.length&&fields.every(x=>x.value.trim()!==''))check()})
}
function status(message,kind=''){const d=$('feedback');d.innerHTML='';let b=document.createElement('div');b.className='msg '+kind;b.textContent=message;d.append(b)}function check(){if(passed)return;let q=order[idx];if(!q)return;let ok=false;if(q.type==='choice'){if(!chosen)return status('先選擇一個答案喔。');ok=chosen===q.answer}else if(q.type==='number'){let v=$('answerInput').value.trim();if(!v)return status('先填入答案喔。');ok=Number.isFinite(normalizeNumber(v))&&normalizeNumber(v)===normalizeNumber(q.answer)}else{const {out,mul}=synthData(q);let inputs=[...$('questionArea').querySelectorAll('.synth input')];if(inputs.some(x=>x.value.trim()===''))return status('還有空格尚未完成，從左至右慢慢算。');ok=inputs.every(x=>normalizeNumber(x.value)===(x.dataset.kind==='out'?out[+x.dataset.i]:mul[+x.dataset.i]));inputs.forEach(x=>{let v=x.dataset.kind==='out'?out[+x.dataset.i]:mul[+x.dataset.i];x.style.borderColor=normalizeNumber(x.value)===v?'#37a47c':'#de9463'})}if(ok){passed=true;status('🌟 答對了！'+(q.type==='synthetic'?' 商式的係數依序為 '+synthData(q).out.slice(0,-1).join('、')+'；餘式為 '+synthData(q).out.at(-1)+'。':'你完成這一題，繼續保持！'),'good');$('checkBtn').classList.add('hide');$('nextBtn').classList.remove('hide')}else status('再試一次！答案尚未通過，請修改後再次提交，或點選提示。','bad')}
$('homeBtn').onclick=()=>{renderHome();view('home')};$('counter').onclick=()=>{if(!$('counter').disabled){renderHome();view('home')}};$('hintBtn').onclick=()=>{const q=order[idx];if(q)status('💡 '+(q.hint||'先從最基本的步驟開始觀察。'))};$('checkBtn').onclick=check;$('nextBtn').onclick=()=>{idx++;renderQ()};
function setTypeFields(){const t=$('editType').value;$('optionsField').classList.toggle('hide',t!=='choice');$('answerField').classList.toggle('hide',t==='synthetic');$('coeffField').classList.toggle('hide',t!=='synthetic');$('rootField').classList.toggle('hide',t!=='synthetic')}function cleanForm(){editing=null;$('editPrompt').value='';$('editAnswer').value='';$('editOptions').value='';$('editHint').value='';$('editCoeffs').value='';$('editRoot').value='';$('saveQ').textContent='新增這道題目'}function renderEditor(){const l=+$('editLevel').value;$('questionList').innerHTML='';questions.filter(q=>q.level===l).forEach((q,i)=>{const row=document.createElement('div');row.className='qitem';const txt=document.createElement('div');txt.innerHTML='<strong>第 '+(i+1)+' 題：</strong>'+pretty(q.prompt)+'<small>'+({choice:'選擇題',number:'數字題',synthetic:'綜合除法'})[q.type]+'</small>';const acts=document.createElement('div');acts.className='actions';let edit=document.createElement('button');edit.className='btn ghost';edit.textContent='修改';edit.onclick=()=>{editing=q.id;$('editLevel').value=q.level;$('editType').value=q.type;setTypeFields();$('editPrompt').value=q.prompt;$('editAnswer').value=q.answer||'';$('editOptions').value=(q.options||[]).join('\n');$('editHint').value=q.hint||'';$('editCoeffs').value=(q.coeffs||[]).join(',');$('editRoot').value=q.c??'';$('saveQ').textContent='儲存修改';window.scrollTo({top:0,behavior:'smooth'})};let del=document.createElement('button');del.className='btn ghost';del.textContent='刪除';del.onclick=()=>{if(confirm('確定刪除這道題目嗎？')){questions=questions.filter(x=>x.id!==q.id);save();renderEditor()}};acts.append(edit,del);row.append(txt,acts);$('questionList').append(row)})}
$('editBtn').onclick=()=>{cleanForm();$('editLevel').innerHTML=LEVELS.map((x,i)=>'<option value="'+i+'">第 '+(i+1)+' 關｜'+x[0]+'</option>').join('');$('editType').value='choice';setTypeFields();renderEditor();view('editor')};$('editLevel').onchange=()=>{cleanForm();renderEditor()};$('editType').onchange=setTypeFields;$('cancelEdit').onclick=cleanForm;
$('saveQ').onclick=()=>{let level=+$('editLevel').value,type=$('editType').value,prompt=$('editPrompt').value.trim(),hint=$('editHint').value.trim();let item={id:editing||uid(),level,type,prompt,hint};if(type==='choice'){item.options=$('editOptions').value.split('\n').map(x=>x.trim()).filter(Boolean);item.answer=$('editAnswer').value.trim();if(item.options.length!==4||!item.options.includes(item.answer))return alert('請輸入剛好四個選項（每行一個），並將「正確答案」填成與其中一個選項完全相同的文字。')}else if(type==='number'){item.answer=$('editAnswer').value.trim();if(item.answer===''||!Number.isFinite(Number(item.answer)))return alert('請輸入數字答案。')}else{item.coeffs=$('editCoeffs').value.split(',').map(x=>Number(x.trim()));item.c=Number($('editRoot').value);if(item.coeffs.length<2||item.coeffs.some(x=>!Number.isFinite(x))||!Number.isFinite(item.c)||$('editRoot').value.trim()==='')return alert('綜合除法請填入完整係數與右側代入數。');item.prompt='利用綜合除法計算，下列多項式除以 x'+(item.c<0?'＋'+Math.abs(item.c):'－'+item.c)+' 的結果。'}if(!item.prompt)return alert('請填入題目內容。');if(editing){let i=questions.findIndex(q=>q.id===editing);if(i>=0)questions[i]=item}else questions.push(item);try{save()}catch(e){alert('瀏覽器儲存失敗，請使用匯出題庫備份。')}cleanForm();renderEditor();renderHome();alert('題目已儲存。')};
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(questions,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='多項式題庫備份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data)||!data.every(x=>typeof x.prompt==='string'&&Number.isInteger(x.level)&&x.level>=0&&x.level<12&&['choice','number','synthetic'].includes(x.type)))throw Error();if(confirm('匯入會取代目前所有題目。確定匯入嗎？')){questions=data;save();cleanForm();renderEditor();renderHome();alert('匯入成功！')}}catch{alert('檔案格式不正確，請匯入本網站匯出的 JSON 題庫。')}e.target.value=''};$('resetBtn').onclick=()=>{if(confirm('確定將所有題目還原成預設題庫？建議先匯出備份。')){questions=defaults();save();cleanForm();renderEditor();renderHome()}};
renderHome();
</script></body></html>
